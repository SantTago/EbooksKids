 <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap');
        
        
        
        .hero-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 25%, #7c3aed 50%, #c026d3 75%, #ec4899 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .joy-gradient {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 25%, #f59e0b 50%, #d97706 75%, #b45309 100%);
        }
        
        .sadness-gradient {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 25%, #3b82f6 50%, #1d4ed8 75%, #1e40af 100%);
        }
        
        .guardian-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .guardian-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        .guardian-card.active {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 25px 50px rgba(251, 191, 36, 0.3);
            border: 3px solid #fbbf24;
        }
        
        .floating-joy {
            animation: floatingJoy 4s ease-in-out infinite;
        }
        
        @keyframes floatingJoy {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-10px) rotate(5deg) scale(1.1); }
            50% { transform: translateY(-5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-15px) rotate(3deg) scale(1.05); }
        }
        
        .floating-sadness {
            animation: floatingSadness 5s ease-in-out infinite;
        }
        
        @keyframes floatingSadness {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
            25% { transform: translateY(-8px) scale(1.05); opacity: 1; }
            50% { transform: translateY(-12px) scale(0.98); opacity: 0.9; }
            75% { transform: translateY(-6px) scale(1.02); opacity: 0.95; }
        }
        
        .heart-pulse {
            animation: heartPulse 2s ease-in-out infinite;
        }
        
        @keyframes heartPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.8;
            }
            50% { 
                transform: scale(1.2);
                opacity: 1;
            }
        }
        
        .sparkle {
            animation: sparkle 2s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0.4; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }
        
        .video-container {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
        }
        
        .video-container::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 3px;
            background: linear-gradient(145deg, #fbbf24, #f59e0b, #d97706);
            border-radius: inherit;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
        }
        
        .activity-card {
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .activity-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }
        
        .activity-card:hover::before {
            left: 100%;
        }
        
        .activity-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        
        .progress-orb {
            background: linear-gradient(145deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3);
            transition: all 0.3s ease;
        }
        
        .progress-orb.active {
            animation: orbPulse 2s ease-in-out infinite;
        }
        
        @keyframes orbPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3);
            }
            50% { 
                transform: scale(1.1);
                box-shadow: 0 12px 48px rgba(251, 191, 36, 0.5);
            }
        }
        
        .emotion-detector {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px dashed #0ea5e9;
            transition: all 0.3s ease;
        }
        
        .emotion-detector:hover {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            border-color: #0284c7;
            transform: scale(1.02);
        }
        
        .joy-zone {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
        }
        
        .sadness-zone {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border: 2px solid #3b82f6;
        }
        
        .popup-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }
        
        .popup-content {
            max-height: 90vh;
            overflow-y: auto;
            animation: popupSlideIn 0.3s ease-out;
        }
        
        @keyframes popupSlideIn {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        .guardian-intro {
            position: relative;
            overflow: hidden;
        }
        
        .guardian-intro::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="white" opacity="0.1"/><circle cx="80" cy="30" r="1.5" fill="white" opacity="0.15"/><circle cx="60" cy="70" r="1" fill="white" opacity="0.2"/><circle cx="30" cy="80" r="2.5" fill="white" opacity="0.1"/></svg>');
            animation: twinkle 4s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        
        .mobile-btn {
            min-height: 60px;
            font-weight: 700;
            font-size: 16px;
            padding: 16px 24px;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }
        
        .mobile-btn:active {
            transform: scale(0.95);
        }
        
        .wave-animation {
            animation: wave 2s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .bounce-gentle {
            animation: bounceGentle 3s ease-in-out infinite;
        }
        
        @keyframes bounceGentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .rotate-slow {
            animation: rotateSlow 8s linear infinite;
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
